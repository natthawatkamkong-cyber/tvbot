name: Coding Agent - bounded issue worker
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number containing a safe coding task'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  issues: read
concurrency:
  group: coding-agent-worker
  cancel-in-progress: false
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preflight and budget gate
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "::error::BLOCKED: OPENAI_API_KEY secret missing"; exit 1; }
          [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid issue number"; exit 1; }
          echo "Provider API may incur charges. Run only after explicit budget approval."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded coding agent
        run: python -m pip install 'aider-chat==0.86.1'
      - name: Read scoped task and implement
        shell: bash
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json title,body --jq '.title + "\n" + .body' > /tmp/agent-task.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BRANCH="agent/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          python -m aider --model gpt-4o-mini --yes-always --no-auto-commits --no-gitignore --message "Implement only the bounded task described below. Never modify workflows, credentials, production deploy or live trading. Keep changes small and testable. Task: $(cat /tmp/agent-task.txt)" app.py tests/test_webhook.py
          python -m pytest -q
          git add app.py tests/test_webhook.py
          if git diff --cached --quiet; then echo "::error::No code changes produced"; exit 1; fi
          git commit -m "Agent: implement issue #$ISSUE_NUMBER"
          git push origin "$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" --title "Agent draft: issue #$ISSUE_NUMBER" --body "Automated bounded implementation for #$ISSUE_NUMBER. Tests: python -m pytest -q. Requires human review; do not auto-merge or deploy."
          echo "Completed branch=$BRANCH commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
